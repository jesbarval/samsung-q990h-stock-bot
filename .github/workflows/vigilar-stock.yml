name: Alerta de stock Samsung Q990H por Telegram

on:
  schedule:
    # Cada 5 minutos (UTC). GitHub puede retrasar u omitir ejecuciones.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      prueba_telegram:
        description: 'Enviar un mensaje de prueba en lugar de comprobar stock'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: q990h-telegram-stock
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar Python (usa Chrome preinstalado en Ubuntu)
        run: python -m pip install -r requirements.txt
      - name: Enviar mensaje de prueba a Telegram (opcional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.prueba_telegram }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py --send-test
      - name: Revisar stock y alertar por Telegram si reaparece
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.prueba_telegram }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py
      - name: Conservar el último estado para evitar avisos repetidos
        if: always()
        run: |
          git add state.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Actualizar disponibilidad Samsung Q990H"
            git push
          fi
