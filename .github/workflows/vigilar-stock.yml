name: Avisos por correo Samsung Q990H

on:
  schedule:
    # Cada cinco minutos UTC. GitHub puede retrasar u omitir ejecuciones.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      enviar_prueba:
        description: 'Enviar un correo de prueba'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: q990h-email-stock
  cancel-in-progress: false

jobs:
  comprobar:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Enviar email de prueba
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.enviar_prueba }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python monitor.py --send-test
      - name: Comprobar stock en Samsung y enviar aviso a Hotmail
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.enviar_prueba }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python monitor.py
      - name: Guardar estado para evitar correos duplicados
        if: always()
        run: |
          git add state.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Actualizar stock Samsung Q990H"
            git push
          fi
